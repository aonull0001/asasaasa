<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名桜線運行情報</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:"Yu Gothic",sans-serif;
}

.board{
    width:90%;
    max-width:1000px;
    background:#000;
    border:6px solid #444;
    border-radius:15px;
    box-shadow:0 0 30px rgba(255,150,0,0.4);
    overflow:hidden;
}

.header{
    background:#222;
    color:#fff;
    font-size:32px;
    font-weight:bold;
    text-align:center;
    padding:15px;
    letter-spacing:3px;
}

.display{
    height:90px;
    position:relative;
    overflow:hidden;
    background:#111;
}

.scroll-text{
    position:absolute;
    white-space:nowrap;
    color:#ff9900;
    font-size:42px;
    font-weight:bold;
    line-height:90px;
    text-shadow:
        0 0 5px #ff9900,
        0 0 10px #ff9900,
        0 0 20px #ff9900;
    animation:scroll 18s linear infinite;
}

@keyframes scroll{
    from{
        transform:translateX(100%);
    }
    to{
        transform:translateX(-100%);
    }
}
</style>
</head>
<body>

<div class="board">
    <div class="header">
        名桜線運行情報
    </div>

    <div class="display">
        <div class="scroll-text">
            名桜線は、下田公園駅での車両故障により、上下線で最大２０分の遅延や、一部列車の運休が発生しています。
        </div>
    </div>
</div>

</body>
</html>
