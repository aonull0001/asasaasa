<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名桜線運行情報</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    font-family:"Yu Gothic",sans-serif;
    color:white;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.board{
    background:#000;
    border:6px solid #444;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(255,150,0,0.4);
}

.header{
    background:#222;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    padding:15px;
    letter-spacing:3px;
}

.display{
    height:100px;
    overflow:hidden;
    position:relative;
    background:#111;
}

.scroll-text{
    position:absolute;
    white-space:nowrap;
    top:50%;
    transform:translateY(-50%);
    color:#ff9900;
    font-size:42px;
    font-weight:bold;
    text-shadow:
        0 0 5px #ff9900,
        0 0 10px #ff9900,
        0 0 20px #ff9900;
}

@keyframes scroll{
    from{
        left:100%;
    }
    to{
        left:-100%;
    }
}

.editor{
    margin-top:20px;
    background:#222;
    padding:20px;
    border-radius:10px;
}

textarea{
    width:100%;
    height:120px;
    resize:vertical;
    padding:10px;
    font-size:18px;
    border:none;
    border-radius:8px;
}

button{
    margin-top:10px;
    padding:12px 24px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#ff9900;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffb84d;
}

.status{
    margin-top:10px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="container">

    <div class="board">
        <div class="header">
            名桜線運行情報
        </div>

        <div class="display">
            <div class="scroll-text"></div>
        </div>
    </div>

    <div class="editor">
        <h2>運行情報編集</h2>

        <textarea id="textInput"></textarea>

        <br>
        <button onclick="saveText()">
            更新
        </button>

        <div class="status" id="status">
            保存されていません
        </div>
    </div>

</div>

<script>

const scrollText = document.querySelector(".scroll-text");
const textInput = document.getElementById("textInput");
const statusText = document.getElementById("status");

let text = localStorage.getItem("meiouInfo") ||
"名桜線は平常通り運転しています。";

textInput.value = text;

function saveText(){
    text = textInput.value;

    localStorage.setItem("meiouInfo", text);

    statusText.textContent =
    "更新日時：" + new Date().toLocaleString("ja-JP");

    startScroll();
}

function startScroll(){

    scrollText.style.animation = "none";

    scrollText.textContent = text;

    void scrollText.offsetWidth;

    const speed = Math.max(12, text.length * 0.2);

    scrollText.style.animation =
    `scroll ${speed}s linear 1`;
}

scrollText.addEventListener("animationend",()=>{

    setTimeout(()=>{

        text =
        localStorage.getItem("meiouInfo")
        || text;

        startScroll();

    },5000);

});

startScroll();

</script>

</body>
</html>
